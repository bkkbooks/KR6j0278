用降三世威怒印真言於兩目童人上觀紇哩字變為日輪流出無量威光於一一光道上有種種金剛火焰猛利杵顰眉怒目右旋顧視菩薩大衆由此金剛威怒眼顧視諸魔隱在大衆中者皆悉退散以此瞻覩本尊及聖衆咸皆歡喜即結印二手各作金剛拳加右左手腕上檀慧反相鉤直竪進力安印當心誦真言三遍真言曰唵遜婆去引𩕳遜婆去引吽短聲後同一仡哩二合釁拏二合仡哩二合釁拏二合引跛野吽三阿去引曩野斛引四婆去誐鑁嚩日囉二合引吽發吒由結此印誦真言住此忿怒三摩地身心所有煩惱業障以金剛猛利慧火焚燒盡即以印左轉三匝辟除障者便右轉三匝隨意大小結為方隅界即印心額喉頂各誦一遍頂上散印次結上方金剛網印準前牆印以禪智各捻進力下節結印成已為金剛杵又從印流出無量金剛杵金剛杵皆流出無邊威焰相續成網頂上右旋印三匝即誦真言曰唵尾塞普二合攞捺囉二合乞灑嚩日囉二合𠰢惹攞吽發吒半音由此網印誦真言加持故即成堅固不壞之網次結火院密縫印以左手掩右手背竪禪智結印成已當作此觀從印流出金剛熾盛火焰誦真言三遍右繞身三匝想於金剛牆外火焰圍繞即誦真言曰唵阿三磨銀儞二合吽發吒半音次結真實大三昧耶印十度內相叉為拳並竪忍願屈進力如鉤在忍願兩邊如三股杵形以禪智附進力側右旋印三匝誦真言三遍護於火院界外即誦真言曰唵賞羯禮摩訶三摩琰娑嚩二合引賀引由此印真言加持故如金輪王等佛頂經說若有人誦持頂輪王等佛頂五百由旬內修餘部真言者請本所尊念誦聖者不降赴亦不與悉地由一字頂輪王威德攝故若結此大界設鄰近持誦輪王人不能沮礙不奪威力所持餘真言皆速得成就次獻閼伽水二手捧閼伽器當額獻誦真言七遍想浴一切聖衆雙足真言曰娜莫三去滿多母馱引南引一唵誐誐曩二三去麼去引摻去麼三娑嚩二合引賀引瑜伽者獻閼伽時心中所希望事舉即發願啓白聖者我所求悉地願速成就次結獻花座印二手芙蓉合掌如未敷蓮花勢當心禪智各捻檀慧甲為臺其餘度如金剛印成已觀印為金剛蓮花又想從印流出無量金剛蓮花座奉獻本尊及聖衆等誦真言曰唵嚩日囉二合迦麼羅娑嚩二合引賀引由結此印誦真言故本尊及營從則真實各受得座已次結蓮花喜戲菩薩印二手蓮花合掌禪智並竪微開安於心上即成瑜伽者觀想自身等喜戲菩薩想從心中流出無量喜戲菩薩供養本尊及一切聖衆蓮花喜戲真言唵破娜麼二合邏引細羅引誐野一摩賀引禰引尾二囉引誐布引惹引三去摩野吽引三由結此印誦真言供養故不久獲得如來地住法圓滿現法樂住證成無上菩提次結蓮花鬘菩薩印即以前印舒臂向前與自額齊運想從額流出無量蓮花鬘菩薩供養本尊及一切聖衆蓮花鬘真言曰唵跛娜麼二合麼黎一鼻詵去左引鼻曬引迦二布引惹引三去摩野吽引三由結此印誦真言供養故獲得相好具足當為三界法王次結蓮花歌讚菩薩印即以前印下至當齊蓮花合掌徐徐漸上至口以印從口向前下瀉想從口流出無量蓮花歌讚菩薩供養本尊及一切聖衆蓮花歌讚真言曰唵跛娜麼二合擬霓以反帝一誐引娜擬準前引多二布引惹引三麼曳引吽引三由結此印誦真言供養故不久當具六十四種梵音四無礙辨能於無量世界轉大法輪次結蓮花舞菩薩印二手各作蓮花拳先於胸右互相旋轉如舞次於胸左亦互相旋轉如舞勢次於頰右次於頰左如前旋轉誦真言不閒斷末後蓮花合掌置於頂上想從頂流出無量蓮花舞菩薩供養本尊及一切聖衆蓮花舞真言曰唵跛娜麼二合𩕳㗚二合底曳二合一薩嚩布引惹引二鉢囉二合襪多曩三去麼曳吽引三由結此印誦真言供養故當得三種迅疾意成身剎那頃於無量世界作神通遊戲利樂有情廣作佛事次結蓮花焚香菩薩印二手蓮花合掌覆二手向下散想從印流出妙香雲海遍周法界普供養一切如來海會蓮花焚香真言曰唵跛娜麼二合度上引跛布引惹引三去麼曳一鉢羅二合賀囉二合引娜野二跛娜麼二合矩羅娜以帝三摩訶誐抳計四跛娜麼二合囉底吽引五由結此印誦真言供養故獲得如來無礙金剛解脫智次結蓮花花供養菩薩印二手蓮花合掌向上如散花勢運想從印流出種種天妙花普供養一切如來海會蓮花花供養真言曰唵補澀跛二合布引惹引三去麼曳一跛娜麼二合嚩引悉𩕳二摩訶引室哩二合曳三跛娜麼二合矩羅鉢囉二合底賀哩四薩嚩引羅攤二合引娑去引馱野吽引五由結此印誦真言供養故獲得百福莊嚴無邊受用身次結蓮花燈燭菩薩印二手蓮花合掌禪智竪相合運想從印流出無量摩尼燈光普照一切佛剎蓮花燈燭真言曰唵儞引跛布引惹引三去麼曳一跛娜麼二合矩羅遜娜哩二摩訶努引底野二合引路引揵散惹曩野三跛娜麼二合薩囉娑嚩二合底吽四短聲由結此印誦真言供養故獲得如來清淨五眼次結蓮花塗香菩薩印二手蓮花合掌當胸上分散如塗香勢想從印中流出塗香雲海普供養一切如來海會即誦蓮花塗香真言曰唵獻馱布引惹引三去麼曳一摩賀引跛娜麼二合矩羅二際致矩嚕三薩嚩羯麼引抳迷四跛娜麼二合悉地吽引五由結此印誦真言供養故獲得戒定慧解脫解脫智見五分法身次結普供養印供養本尊及聖衆二手十度初分相交結印成已誦真言思惟從印流出種種供養雲海天妙妓樂歌舞嬉戲等天妙衣服飲食燈明閼伽賢瓶劫樹寶幢幡蓋諸寶等類一切人天所有受用之物衆多差別供養具如大乘契經所說供養之具周遍一切世界盡虛空遍法界一切微塵剎土諸佛海會一一聖衆前皆有真實供養誦真言曰曩莫薩嚩沒馱地薩怛嚩二合引南引薩嚩他引缺嗢娜誐二合帝娑頗羅呬𤚥誐誐曩劍平娑嚩二合引賀引次誦本尊讚歎曰唵嚩日囉二合達摩蘇娑怛嚩二合引囉他一嚩日囉二合鉢娜麼二合蘇輸引馱迦二路引計濕嚩二合羅蘇嚩日囉二合引乞叉二合三嚩日囉二合寧上引怛羅二合曩謨引薩都二合諦
