body:
  text: 特進試鴻臚卿大興善寺三藏沙門大廣智不空奉詔譯歸命金剛手密主大菩薩能說最上乘令速證菩提賀野紇哩縛能摧諸魔障以慈悲方便現大忿怒形成大威日輪照曜無邊界修行者暗暝速得悉地故流沃甘露水洗滌藏識中熏習雜種子速集福智聚獲圓淨法身故我稽首禮我今依密言微妙理趣教說最密儀軌阿闍梨先擇修密言弟子淨信三寶者愛敬於大乘渴仰瑜伽教好修菩薩行其心不怯弱求學相應門捨身命及財無厭倦吝惜族姓具諸根多聞護正法愛樂六度行愍念諸有情常被大誓甲盡度無邊界一切有情類令疾證菩提阿闍梨若見如是法器人方便而勸誘先當為演說微妙菩提道善巧般若理速疾菩提路然與受三歸令發菩提心次授與三世無礙三種戒菩薩之律儀方引入輪壇受與本所尊持明護灌頂應示曼荼羅告令三昧耶從今至成佛勿捨菩提心恭敬阿闍梨等同一切佛猶如執金剛於諸同學處深敬不輕慢從師受金剛及受金剛磬為求悉地故乃至菩提場常持不應捨親對灌頂師具受本尊教決定無疑謬然後勇進修修瑜伽者從師受得本尊儀軌已當於間處或於山林幽谷諸教所說勝上之處建立淨室或於精舍治其地以瞿摩夷塗拭又白檀泥塗道場周匝懸播上施天蓋於壇西安本尊像瑜伽者於壇東對像敷茅薦為座或坐被腳小床上分布漫荼羅列諸聖位置二閼伽滿盛香水安四賢瓶於壇四角每日取種種時花散壇上燒香塗香燈明飲食及果子加持分布四邊供養隨力所辦陳設莊嚴每入道場虔誠作禮發露懺悔隨喜勸請回向發願爾時金剛手菩薩告文殊師利言有大威怒王聖馬頭尊我今說是心及妙印故一切大衆咸來至此時金剛手菩薩復告文殊師利言善男子諦聽無邊功力勇健無邊如來奉事是大威怒王復過去阿僧祇俱胝如來皆蒙教示得成無上正等菩提有無量天龍八部等恆常供養恭敬承事若才憶念是威怒王能令一切作障難者皆悉斷壞一切障者不敢親近常當遠離是修行者所住之處四十里內無有魔事及諸鬼神等與諸大菩薩共同得止住時金剛手菩薩從三摩地警覺召集一切聲聞辟支佛一切天龍藥叉乾闥婆阿素羅迦嚕羅緊那羅摩睺羅誐人及非人一切群生等皆來集會復抽撮彼群生衆生差別之心令同一體等住三摩地各俱胝焚燒世界火滅唯成一大火聚如七日光照大馬口等衆流俱湊吞納無餘盡成猛焰說是大威怒王聖者馬頭尊微妙心亦如大馬口吞噉焚燒一切衆生藏識中若于熏習雜種心等說最勝根本真言曰曩莫三曼多嚩日囉二合𧹞一跢姪他二主嚕主嚕三毗主嚕毗主嚕四伽跢藥叉五摩訶婆囉六薩嚩毗底娜二合毗那夜迦七皤陀匝謨枳底二合八沒跢野吽發吒九才誦此妙真言三千大千世界六種震動一切佛剎土咸被大威怒王火光焚燒同一體相成大火聚蘇彌盧山摩訶蘇彌盧山鐵圍山大鐵圍山一切大海皆悉枯涸乾燒成就灰燼聖者馬頭尊大威怒王妙心三摩地如是行者常應住大菩提心深起悲愍即運心觀想遍滿虛空一切如來具諸相好皆入法界定又觀自身住佛海會中即結警覺一切如來印二手各作金剛拳檀慧相鉤直舒進力二度側相拄誦真言曰唵嚩日嚕二合底瑟姹二合吽由結此印誦警覺真言一切如來皆從定出瑜伽者應作是思惟啓告諸佛我身少慧少福沒於苦海伏乞諸佛威神之力唯願不捨大悲本願慈悲矜愍觀察護念拔濟於我彼一切如來各以神力加持護念修瑜伽者獲無量福聚身心自在次應禮四方如來請求加護先禮東方阿閦如來等一切如來瑜伽者即以全身委地二手金剛合掌長舒頂上以心著地至誠敬禮真言曰唵薩嚩怛他引去蘗多一布引儒鏃固反引跛婆他二合引曩引夜引多麼二合引南二𩕳哩野二合引多夜引銘引三薩嚩怛他去引蘖多四嚩日囉二合薩怛嚩二合地瑟姹二合娑嚩二合𤚥引五吽由結捨身印及誦真言奉獻供養禮敬瑜伽者由作此禮乃至成佛常得金剛薩埵加持令菩提心圓滿次禮南方寶生如來等一切如來如前展身委地金剛合掌下當心以額著地至誠禮敬真言曰唵薩嚩怛他去引蘖多一布引惹引鼻曬引迦引夜引多麼二合南二𩕳哩野二合引多上夜引銘三薩嚩多他去引蘖多四嚩日囉二合囉怛曩二合鼻詵去左𤚥引五怛羅二合引由結捨身印及誦真言奉獻供養敬禮故乃至成佛地地中常得虛空藏菩薩受與灌頂福德圓滿具諸相好當為三界法王次禮西方無量壽如來等一切如來如前展身金剛合掌置於頂上以口著地至誠敬禮真言曰唵薩嚩怛他去引蘖多一布引惹引鉢羅二合𮧬怛曩引夜引多麼二合引南二𩕳哩野二合引多上夜引銘三薩嚩怛他去引蘖多四嚩日囉二合達磨鉢羅二合𮧬怛野𤚥五引紇哩由結捨身印及誦真言奉獻供養禮敬故乃至成佛常得觀自在菩薩加持智慧圓滿轉妙法輪次禮北方不空成就如來等一切如來展身如前金剛合掌置於當心以頂著地至誠禮敬真言曰唵薩嚩怛他去引蘖多一布引惹引羯麼抳阿去引多麼二合引南二𩕳哩野二合多上夜引銘三薩嚩怛他去引蘖多四嚩日囉二合羯磨矩嚕𤚥引五阿由結捨身印及誦真言奉獻供養禮敬故乃至成佛常得金剛業菩薩加持以一切佛世界成就廣大供養業瑜伽者即結跏趺坐端身正念不動支節閉目靜寂入四無量心觀即結定印初入慈無量心定以愍清心遍緣六道四生一切有情皆具如來藏備三種身口意金剛以我修三密功德力故願一切有情等同普賢菩薩如是觀已即誦大慈三摩地真言曰唵摩賀引昧引怛囉二合夜娑頗二合羅次應入悲無量心三摩地智以悲愍心遍緣六道四生一切有情沈溺生死苦海不悟自心妄生分別起種種煩惱隨煩惱是故不達真如平等如虛空超恆沙功德以我修三密加持力故願一切有情等同虛空藏菩薩如是觀已即誦大悲三摩地真言曰唵摩賀引迦嚕拏上夜引娑頗二合羅次應入喜無量心三摩地智以清淨心遍緣六道四生一切有情本來清淨由如蓮花不染客塵自性清淨以我修三密功德力故願一切有情等同觀自在菩薩如是觀已即誦大喜三摩地真言唵秫詩筆反馱鉢羅二合謨引娜娑頗二合羅次應入捨無量心三摩地智以平等心遍緣六道四生一切有情皆離我我所離蘊處界及離能取所取於法平等心本不生性相空故以我修三密功德力故願一切有情等同虛空庫菩薩如是觀已即誦大捨三摩地真言曰唵摩護引閉乞灑二合引娑頗二合羅瑜伽者由修習四無量心定誦四無量心真言於未來所有人天種種魔業障難悉皆除滅身中頓集無量福聚心得調柔堪任自在修瑜伽者不應執著外清淨常以勝義自性清淨法水洗滌身心如理相應誦清淨真言三遍真言曰唵娑嚩二合婆引嚩秫馱引薩嚩達莫引娑嚩二合引婆嚩秫度憾如金剛頂瑜伽經中說身口意金剛菩提心為先淨心為澡浴利樂修瑜伽者即取塗香塗二手合掌當心即結如來部三摩耶契如未敷蓮合掌即以進力附忍願上節禪智各附進力側結成印已誦真言入瑜伽作意觀一切如來遍滿虛空願加持我又想從印流出無量光明照觸盡無餘一切有情速證平等真如以此佛三昧耶契速證瑜伽願一切有情證得究竟大菩提即誦真言曰曩莫三曼多沒馱南引唵怛他引蘖妬納婆二合嚩野娑嚩二合引賀由誦此真言及結印作意等同一切如來當獲具相卅二無見頂相三身圓滿以此印安於頂上隨便解散次結蓮花部三摩耶印又芙蓉合掌當自心前檀慧禪智並竪餘六度散開屈如八葉蓮花結印已誦真言入甚深大悲瑜伽三摩地觀滿虛空界觀自在菩薩與無量持蓮花者願加持我復起此觀從印流出無量光明照觸六趣有情根本藏識中雜染種子獲得自他平等無緣大悲速得如幻三摩地隨類六趣示現種種身四無礙解脫具六十四種梵音頓應一切有情以成佛道真言曰曩莫劍摩攞播拏曳唵鉢納摩二合納婆二合嚩引也娑嚩二合引訶由結此印及誦真言加持故等同觀自在菩薩當獲十地十自在三種意生身以此印於自口上解散次結金剛部三昧耶印二手相背檀慧禪智互相叉結印成已誦真言入菩提心三摩地觀遍滿虛空界金剛手菩薩與馬頭無量忿怒衆集會願加持我復想從印流出無量光明照觸一切有情不定趣異生趣向二乘速成大菩提真言曰曩莫三滿跢嚩日囉二合𧹞引唵嚩日嚕二合引納婆二合嚩引也婆嚩二合引訶由誦此真言及結印作意不久當得金剛薩埵身口意金剛能說密教教令輪以作盡無餘有情上中下悉地速疾頓證悉地因便以此印當自心前解散復作是念盡無餘世界中有無量無邊有情雖發無上菩提之心雖積集福德智慧資糧闕瑜伽智慧方便加持妙法退失善根諸魔得便云何為彼引入解脫輪為一一有情說三密瑜伽微妙大乘速疾頓獲世間出世間殊勝悉地果報發如是心則成被大誓莊嚴甲胄次應結金剛明王最勝印二手內縛忍願並申以進力二度屈如鉤當忍願初節背如三股金剛杵形禪智並申直附忍願側真言曰曩莫三曼多沒馱南引唵嚩日囉二合銀儞二合鉢囉二合捻引跛跢二合引也娑嚩二合引賀以此印印額左右肩心喉等五處頂上散由結此印及誦真言作意即成被金剛甲胄同金剛明王威光赫奕無量無邊金剛族使者侍衛一切障難及不善心有情無能侵害上於虛空界乃至下風輪際所有空行地居下毗那夜迦等類皆起慈心不能為障礙修真言行菩薩次應結金剛輪菩薩印誦真言以入曼荼羅者受得三世無障礙三種菩薩律儀由入曼荼羅身心備十佛微塵剎世界微塵三摩耶無作禁戒因屈伸俯仰發言吐氣起心動念廢忘菩提之心退失善根以此印契真言殊勝方便誦持作意能除違犯愆咎三昧耶如故倍加光顯能淨身口意故則成入一切曼荼羅得灌頂三摩耶則應結契二手內相叉進力並申直忍願纏進力初節前各以峯相跓禪智並申直當心誦真言七遍真言曰曩莫悉底哩也四合地尾二合迦引南引怛他引蘖跢引南引暗尾囉爾尾囉爾摩訶斫羯羅嚩日囉二合娑跢娑跢娑羅帝娑羅帝怛羅二合以怛羅二合以尾馱麼爾三畔惹儞怛囉二合麼底悉馱引擬哩二合怛囕二合引娑嚩二合賀誦此真言時作是觀念盡虛空界遍法界三界生死六趣有情速得入金剛界大曼荼羅等同金剛薩埵大菩薩次結金剛合掌印二手十度右押左互相交合即成真言曰唵嚩日朗二合引惹哩由結金剛合掌印速得滿足十波羅蜜得十自在次結金剛縛印以前印十度外相叉作拳即成真言曰唵嚩日囉二合滿馱由結金剛縛印瑜伽者速得十地滿足次結摧十種障金剛縛印如前金剛縛以印三度掣拍心上即成真言曰唵嚩日囉二合滿馱怛囉二合吒由結此印能摧滅心中十種惑障則顯現發揮身口意金剛次結金剛遍入印如前金剛縛印禪智屈入掌各捻戒方置於心上真言曰唵嚩日囉二合引吠微閉反捨惡由結此印瑜伽者身中三密金剛皆得順伏加持不散次結金剛拳三昧耶印如前金剛縛遍入印進力屈跓禪智背即成真言曰唵嚩日囉二合母瑟置二合鑁由結金剛拳三摩耶印身口意金剛合為一體修瑜伽者速得一切成就次結三摩耶印如前金剛縛直竪忍願相合即成誦真言一遍真言曰唵三去麼野娑怛鑁二合則觀自身等同金剛薩埵處在月輪又觀金剛薩埵在身前如鏡中像與身相對等無有異由結此印誦真言觀念相應故即得於一切印為主宰次結大三摩耶真實印二手金剛縛忍願屈