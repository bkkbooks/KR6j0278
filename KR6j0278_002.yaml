其中所有一切有情照觸大威怒王威光悉離諸苦惱得大安樂又法若欲得咩古來者取蘇摩那華大威怒王像前加持二十一遍散像腳竟右手取華所行之處隨愛咩古從後加持華七遍方散即來又若彼此俱有心者取果子加持二十一遍使人送食時迷亂極相愛念更無他意又法若欲論議者取牛黃麝香龍腦香三昧和研加持一百八遍點著頂上及二膊上心喉眉間髮際腦後又取白芥子加持三七遍以右手把至論議所門邊散之仍左手中留少許分正論議時以右手把左手芥子向論議人和蜜散已便即彈指即皆得勝他不被天難地難及病難當得大成就又法若一切人患頭痛者取其名字即誦真言加持水作吽字聲已即以此水打其頭上印其痛處其痛即愈風病熱病頭病腳病四百四病萬惱皆悉消除斷盡乃至世間所有八萬四千種鬼病皆悉治之無不差者皆得成就又法破滅諸法欲令餘人所作呪法不成辦者當作四肘三色粉壇南北西三面盡蓮華座於其座上盡著牙形東面華座上盡作跋折羅印燃十二燈百味異食辦備八盤其食日別換著新者新新供養滿於七日日別仍須加持白芥子一百八遍一呪一投火中燒之一切諸人作法皆破不能成辦若十地菩薩聞大威怒王呪不隨順教法者尚能銷融猶等正覺者不順教令輪者悉能銷融何況餘諸天龍八部作障難者誦妙真言滿一萬遍則能種種猛利調伏法由此大威怒王威勢故五百由旬內不得諸尊悉地即修行者蒙大威怒王加持得威德自在又法對馬頭尊像前先取俊木長八指截燒火焰出取安悉香作百八丸一丸一呪一投火中燒之乃至香盡毗那夜迦即自被縛又法若有惡人怨家於善人起惡意相危害者應當鑄作一金銅威怒王像隨意大小其像形現四面八臂每四口上下利牙出現八手把金剛器杖正面頂上現一碧馬頭頭髮如螺焰大暴惡形乘青水牛其牛背有蓮華形其華形上而蹲坐遍身火焰炯然逾劫災焰大威怒王降伏三世設都嚧妙形如是當對此像前作三角壇壇底畫彼惡人形或書姓名像面向北若向惡人所居方持誦者身著黑衣面向像坐起大惡心忿怒勵聲三日三夜三時念誦即三日已其惡人死亡眷屬無殘留若欲蘇生深起慈愍心取蓮華根搗末以大悲三昧耶真言一日一夜不飲食滿一百八遍即惡人及眷屬蘇於佛法起歸敬二羽合掌屈進力作谷撥之心起大慈悲真言曰曩莫三曼多沒馱南引伽尾波囉二合咄嚧嗚𤙖平引莎嚩二合賀又法若欲打西若者馬頭尊像前作三角壇念誦一十萬遍三日三夜斷食香摩壇上種種香華以淨飲食乳粥果子等種種供養搗娑闍囉娑香以白蜜和為八千丸呪一一丸香一遍已投火中燒之如是乃至香盡彼西若衆尋即初見變為馬頭更經少時轉為賀野紇哩嚩頭持誦者奇上向彼衆時一切西若悉皆散滅又法若種種災難起國土亂他國怨敵數來侵擾百姓不安大臣謀叛疾流行水旱不調日月失度如是災難起時是土國王身心精進請取持明者大威怒王像前作念誦以滑瀘草搵蘇乳蜜護摩數滿十萬遍外國怨敵即自降伏各還政治國土通洞慈心相向王子百官皆行忠亦妃后婇女孝敬向王諸龍鬼神擁護其國雨澤順時果實豐饒人民歡樂又法若家內遇大惡病百怪競起鬼神邪魔㧌亂其家惡人橫造口舌以相謀害室家大小內外不知者向馬頭像前作念誦數滿一萬遍諸惡事悉皆消滅又法若為王官收録身繫囹圄禁閉杻械枷鎖憶念大威怒王者官自開思澤放還上從王宮至于下囹處不行此法者專莫有此處又法先以大麥與牛喫已取糞中麥洗乾拭搗煮為乳麋從白月一日食此乳麋至十三日每食加持餘殘置清淨處奉獻馬頭尊使者即斷不食大聖像前以塗香塗地散種種花燒諸名香種種飲食供養畢已取迦比闍香搗為細末水和為丸數滿八千丸取迦陀羅木為柴然火取一香丸一呪一投於火中燒之如是乃至八千丸盡其炭變為蘇跛那金重百千兩又法若欲喫他呪者取己身中少許血已和白芥子為八千丸黑月十四日一不食取佉陀羅木爐中然火取前白芥子丸一呪一丸投火中燒之如是乃至芥子丸盡一切諸呪悉皆喫盡又法但誦真言行於曠野處及諸沙磧所須飲食自然而離去又法若人夜失不淨取於白線先用上呪加持一百八遍後作呪索一呪一結為二十一結即用繫腰更不漏失又法日月蝕時取淨牛蘇一兩新瓦鉢盛即把此鉢仰看日月呪鉢中蘇乃至蘇暖或煙火出當爾時即飲此蘇服此蘇已隨欲詣處舉意即至若常誦此呪者一切怖畏得無所畏所有障難悉解脫又法若患路陀瘡及諸毒蛇之所𮯍者或患健毗吒雞瘡此等諸瘡呪黃土塗滿一千遍塗其瘡上即得除差一切怖畏心念即除滅又法若人忽逢一切水難心念即得不被沈溺如是等法不可廣說隨意即成就若造大曼荼羅者不得行欲次復說賀野紇哩嚩像法更有畫像法取淨白縶不得截割請一畫師最功能者勿還其價香湯洗浴著新淨衣與授八戒日日如是於清淨處作一水壇縱廣四肘持誦者護身結界畢已與彼護身於其壇中燒種種香散種種華供養已訖於此壇內畫作大威怒王像總有四面皆忿怒每四口狗牙上下出現頭髮微竪如火焰四面頂上各戴天冠及著耳璫其天冠上有化佛結跏趺坐中面頂上作碧馬頭頂下著諸寶瓔珞身色赫奕如日輪遍身火焰逾劫災火有八手左右二手結根本馬口蜜印右方一手執鋭劍左方一手執金剛棒右方一手執金剛鉞𨨞左方一手執金剛寶輪右方一手作旋無畏左方一手執念珠安坐寶盤石上青蓮華臺其盤石山色赤黃青色每八手腕上各皆作寶釧身分莊嚴如餘處說作此像從白月十四日起首食大麥乳麋後十三日十四日十五日三日三夜斷絶不食斷言語念誦取娑迦毗遮香乾陀那句利華呪此二物一呪一投當前面上至八千遍其面口中放出光明其光圍繞行者身已還入像口於其口中出如意珠即當收取此珠已即得十四千歲壽活尋得七寶轉輪聖王命終以後生安樂國從馬頭尊足下而生又法當乞食喫大麥乳麋作念誦滿七落叉遍一落叉遍時毗那夜迦即得被縛二落叉遍呪法成就三落叉遍即得安善那摩那熾羅藥法成就三日三夜不食作法手把其藥正呪藥時藥中若現三種相者即知藥成言三相者謂暖煙焰即得成就安陀羅陀那升空而去即得成就持呪仙人自在得入阿修羅宮四落叉遍離地四指而行自在五落叉遍即得隨意升空而行六落叉遍即得千歲活則持得現身往詣十方諸佛國土持明者成就呪仙隨其所作任運皆成就一切所呼喚者皆來七落叉遍行者即得頭髮變作螺髮成就隨其所須應念即至親近承事大威怒王即知三世一切衆生死此死彼即得成就若有沙門若波羅門諸善男子善女人等意欲受持大威怒王法準前應作四肘壇法當覓勝地清淨之所掃灑清淨復以香水牛糞埿土地懸種種雜色幡蓋寶鈴珮鏡并諸金銀種種間錯嚴飾道場其道場中立五色壇縱廣四肘先下白色次黃次赤次青次黑而作四門其壇中心作蓮華座安置馬頭尊像正當東門作兩蓮華座安波羅多摩波羅遮那等二童子正當北門作二蓮華座安一髮羅剎阿婆羅底等二童子其壇南方外餘者種種供養更無華座作八大龍王此八大龍王唯以稅米乳麋乳麋供養以外餘者種種供養亦得燃四十五燈喚八箇龍王其壇西門近如南畔安一火爐以胡麻稻穀華等蘇蜜相和竟誦大威怒王心真言加持前和物一遍呪已投火中燒一一如是乃至一千八遍已一日一夜不食如不忍飢唯得食蘇香湯洗浴著新淨衣入道場中而作供養或一七日或二七日或三七日或三十五日或四十九日或九十日若六時若四時若三時若二時若一時如上護摩作念誦莫限遍數則能施功速獲得五種成就事所謂息災增益降伏敬愛鉤召等也所有希望世間出世間果報皆悉成就本教中所不說成就法者用蓮華部中法對此像前作必獲成就我又於一切諸尊法中皆有大靈驗常憶念大威怒王故滅無量罪得無量福命終以後生安樂國從馬頭尊右脅而生又法若欲論議當作前四肘壇而供養者皆得勝上不被他難及病難作此壇已病無不差若被毒藥蟲虎等之所傷者當誦前根本真言者無有不差用蘇木佉子搗以為末極令微細用酪汁和如法用大威怒王心真言二十一遍加持與其病人空腹服之腹內所有一切毒蟲悉皆吐出為一切病惱我醫王治之不差者無有此處是古本願我大慈大悲馬口本願深重故化一切衆生專勝諸尊由大慈故不著生死由大悲故不住涅槃常住無明諸境界中斷盡種種諸惡趣滅盡六道四生生老病死之苦又能噉食滅盡取事近喻如羸飢馬食草更無他念此本願力故十方剎土無不現身瑜伽者深起菩提心每日誦一百八遍大威怒王現身奉事修瑜伽者喻如奴婢恭敬猶如婆誐鑁二世菩提何非成憶念大威怒王者不墮三惡道決定往生諸佛國土被此威怒尊加持時設諸惡人惡魔惡禽獸乃至厭魅蠱術魑魅魍魎惡鬼神等起惡心欲惱害行人遠近來向行人住處則路中自所殺害此神驗四十里外圍繞令無諸障礙又常加持諸持明者令菩提心不退轉復說使者四大童子像法此四大童子一雙同體無異其形甚大暴惡大有強力身色青赤索髮分垂左右各各身著赤袈裟前後腰背𦜮間繞虎皮以為刀布二手腕上各有寶釧唯婆羅多摩者左右二手執一利鉾婆羅遮那者左右二手執鉞𨨞一髮羅剎者右方手執金剛棒左方手執羅索阿婆羅底者右方手執利劍左方執拔折羅此四大使者王各威德自在各守護威怒王各跪坐瑟磬石上遍身有大火焰熾盛照曜如照日光大暴惡形能降伏諸外道及天魔定諸惡夜叉惡鬼神等悉皆令歸依佛法憶念大威怒尊故四大童子常隨守護不離其側如不離身景如護眼精如護己命守使者故即能通達三世之事若有人未誦真言才憶念威怒王者守護二使者誦持真言者四大童子晝夜守護不離側邊又當說八大龍王像法此八大龍王者同體無異龍頭蛇身遍身皆有火焰若雷電霹靂降大雹澍大雨時當喚八箇等龍王名號能制止諸雷電即得消散若又大地悉震列搖動山河石壁碎破暴惡嵐忽吹來諸大樹摧折如是諸惡難起時諸衆生恐怖不安者當喚彼八箇等龍王名號則能止制諸地動及惡風五穀豐饒萬姓安樂隨順風雨時節國土安隱更無有災難何況行者身上若有災難者莫有此處魔不得其便速證得大菩提不久當成佛聖者馬頭尊大威怒王使者法門說已畢
