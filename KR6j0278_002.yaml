body:
  text: 特進試鴻臚卿大興善寺三藏沙門大廣智不空奉詔譯次結檀波羅蜜菩薩印右手仰掌屈忍度與禪度相捻餘度皆舒即誦真言曰唵婆去誐嚩舞可反底丁以反那引曩引地跛帝尾娑㗚二合惹引布引羅馱野娜引娑嚩二合引賀引由結此印誦真言三遍即滅無量劫慳吝業種獲得三種施福所謂資生施無畏施法施即檀波羅蜜圓滿現生獲得富饒資緣具足心得自在壽命長遠次結戒波羅蜜菩薩印二手內相叉禪智直竪誦真言曰唵試引攞馱引哩抳婆去誐嚩底吽引郝由結此印誦真言三遍即滅無量劫破戒業種獲得三種戒功德所謂攝律儀戒攝善法戒饒益有情戒即戒波羅蜜圓滿常以戒品莊嚴身口意業所有違犯四重禁苾芻尼犯八他勝罪悉皆清淨當來獲得隨願往生次結忍辱波羅蜜菩薩印準前戒波羅蜜印以進力相合如針禪智並立即誦真言曰唵婆去誐嚩底乞鏟二合引底馱引哩抳吽發吒由結此印誦真言三遍則滅無量劫瞋恚業種獲得三種忍功德所謂害怨耐忍安受苦忍諦察法忍則忍辱波羅蜜圓滿儀容端嚴令人樂見不相憎嫉皆來親附勝解尤深隨念變化次結精進波羅蜜菩薩印準前忍波羅蜜印進力折開即成真言曰唵尾引哩野二合迦哩吽尾引哩囊二合娑嚩二合賀由結此印誦真言三遍即滅無量劫懈怠懶惰業種獲得三種精進所謂被甲精進攝善法精進利樂有情精進即精進波羅蜜圓滿身心安樂離諸疾病無有苦惱彼出世福智願皆得成辦次結禪波羅蜜菩薩印即結跏趺坐左手仰掌於跏趺上以右手仰於左手上以禪智二度甲相跓即誦真言曰唵婆誐嚩底一薩嚩播引跛賀引哩抳二摩賀引奈引底曳二合引三吽引吽吽吽五發吒由結此印誦真言三遍即滅無量劫散亂業種獲得三種靜慮所謂安住靜慮引發靜慮辦事靜慮即禪波羅蜜圓滿身心輕利所修神通速得成就諸魔不能侵擾一切業障悉皆消滅次結般若波羅蜜菩薩印左手平舒五指仰置心下以右手覆於左手上即誦真言曰唵地引室哩二合輸嚕二合多尾惹曳娑嚩二合賀由結此印誦真言三遍即滅無量劫愚癡業種獲得三種慧所謂人空無分別慧法空無分別慧俱空無分別慧則般若波羅蜜圓滿獲得聰明智慧悟解世間出世間法博達五明甚深義理次結方便波羅蜜菩薩印左手慧方握智度右手檀戒握禪度二手相博忍願相背直竪如針進力平舒相跓即誦真言曰唵摩賀引每怛羅二合唧帝娑嚩二合賀由結此印誦真言三遍即滅無量劫無善巧方便業種獲得二種方便善巧所謂回向方便善巧拔濟有情方便善巧即方便波羅蜜圓滿修持世間六波羅蜜由此印真言瑜伽相應少施功業福德廣多疾得成就皆究竟最勝無上菩提資糧次結願波羅蜜菩薩印左手直竪五度以掌向外作施無畏勢即誦真言曰唵迦嚕抳尼直反賀賀糝由結此印誦真言三遍即滅無量劫惡願業種獲得二種勝願所謂求無上菩提願利樂有情願波羅蜜圓滿從初發心乃至成佛於其中間所求世間殊勝上願皆得圓滿次結力波羅蜜菩薩印准前戒波羅蜜印禪智進力忍願皆竪頭相合誦真言曰唵娜麼𩕳母休帝吽引賀賀賀吽引弱由結此印誦真言三遍即滅無量劫於世出世劣意業種獲得二種力所謂思擇力修習力於諸對治法伏得諸煩惱斷諸惑障修道時決定勝解一切天魔惡友不能移易獲得不退轉次結智波羅蜜菩薩印二手外相叉作拳檀慧直竪互交少分屈進力頭跓令圓忍願直竪頭相合即誦真言曰唵麼麼麼枳娘二合引囊迦哩吽引娑嚩二合賀由結此印誦真言三遍即滅無量劫俱生我執種俱生法執種獲得二種受用智所謂受執用法樂智成就有情智斷二種障所謂煩惱障所知障證得一切法如幻如陽焰如夢如影像如谷響如光影如水月如變化如因陀羅網如虛空不久滿足十地住法雲地為大法師次結婆羅跢羅童子印二手內相叉作拳竪進力頭相跓令圓禪智並竪真言曰跢姪他二勃地勃地二素勃地三因達梨二合勃地四麼迷輸上音迦藍上音二合五婆羅謀者都二合娑嚩二合賀由結此印誦真言三遍故諸毗那夜迦不得其便若有惡人無辜作留難者想彼惡人在行者足下誦真言二十一遍所有留難者悉皆消散起慈心相向不能障礙又能助本尊力次結婆羅遮那童子印二手內相叉進力二度合竪微開禪智並竪即成真言曰跢姪他一薩羅波羅二合薩囉二社耶毗社耶三拔折羅二合句羅三婆去音四皤娑跛那五迦車日都死六娑嚩二合賀由結此印誦真言三遍故能降伏辟除一切惡魔又一切賊難不能害能助本尊次結一髻羅剎童子印準前婆羅遮那印進力頭相合如針即成真言曰跢姪他一唵二濕閉二合多夜三濕閉二合多善闍去音夜四𪾼去音醯𪾼醯五鉢羅魔輸馱六薩埵七摩訶迦嚧膩迦八娑嚩二合賀由結此印誦真言三遍故辟除四方所有一切魔鬼神等能助本尊力次結阿婆羅底童子印準前一髻羅剎印進力微屈如蓮葉即成真言曰唵一唎悉底哩二合盧迦毗社夜二阿謨伽波舍三摩訶鳩嚧馱四囉闍夜五唎陀去音夜六阿波羅底訶跢七吽吽發八娑嚩二合賀由結此印誦真言三遍故能辟除天上虛空所有一切諸魔惡鬼神等成諸事業無有妨難能助本尊力一切悉地行者隨心成就次結難陀龍王印兩大指並竪合捻二小指頭兩手並竪相著二頭指相捻在二大指小指上無名指亦爾二中指在上頭少不相到掌下相著頭指來去真言曰唵摩訶室唎二合曳娑嚩二合賀次結婆索難龍王印頭指以下四指反叉向內相捻左大指屈入頭指中閒右大指舒直向內勿曲兩腕相合以右大指來去真言曰唵一摩訶稅去音羝二娑嚩二合賀次結德叉迦龍王印合腕二食指二中指二無名指並屈頭相拄與本節合平二大指並竪相著捻食指頭側二小指竪頭相著大指來去真言曰唵一賜但上音盧但盧二毗闍去曳三娑嚩二合賀引次結羯固吒龍王印合腕二大指二小指直竪頭合餘指不相著直竪真言曰唵一菩底都爾反下同二菩陀鉢底三輸達上音儞四娑嚩二合賀次結般摩龍王印二手中指無名小等三指向外相叉合掌右押左指頭博掌背並二食指相著大指亦然各博食指大指來去真言曰唵一鳥特二合伽上音底二息普二合嚕三娑嚩二合賀次結摩訶般摩龍王印左手大指屈而向掌又屈頭離大指頭四五分許中指以下三指捻甲相博以印橫側著心上指頭向右真言曰唵一濕閉二合羝二闍儞三娑嚩二合賀次結商佉婆羅龍王印左右無名指各別在中指背上竪二中指頭相著合竪二小指二大指並著屈二食指頭相拄各押大指頭其食指齊第二節合平食指來去真言曰唵一毗𠼝二合俱上音底號二合二婆羅提三伽羅波四娑嚩二合賀次結鳩利迦龍王印屈二無名指在掌右押左二小指二中指各竪相著屈二食指各附中指第一節下以二大指屈博食指下節側真言曰唵一婆伽婆底號二合二毗唎二合俱上音底號二合下同三鉢羅二合那儞號四鉢羅二合婆皤底五娑嚩二合賀由結此八大龍王印及誦真言各三遍與無量龍衆俱圍繞助本尊力修瑜伽者成諸事業威德自在次結自在天印右手作拳安右腰左手五指直竪相著地水二指屈中節火風空三指各少相去即成印向外立之真言曰囊莫三曼跢勃馱南唵伊去舍曩去曳娑嚩二合賀次結帝釋天印右手同前左手五指直竪相著地水二指屈中節以風著火背空屈中節真言曰唵因捺囉野娑嚩二合賀次結火天印左手作拳安腰右手五指直竪相著屈空納掌中風屈中節真言曰唵阿誐那曳娑嚩二合訶次結焰魔天印先合掌二地屈中節背相著二風亦屈背著以二大指各押風中節即成真言曰唵焰摩耶娑嚩二合賀次結羅剎天印右手作拳安腰左手五指直竪相著屈地水中節以空端押地水甲即成真言曰唵地哩底曳娑嚩二合賀次結水天印右手如前左手握拳空勿入掌中風直竪中節少屈即成真言曰唵嚩嚕拏野娑嚩二合訶次風天印右手如前左手五指直竪著地水屈中節即成真言曰唵嚩耶吠微佶反娑嚩二合訶次結毗沙門天印先合掌十指內相叉二水竪頭相拄二風竪微屈左空入右掌中押左火甲右空越左空背入左掌中押右火甲真言曰唵吠室囉二合嚩拏野娑嚩二合賀次結梵天印右手作拳安腰左手五指著竪之少屈其高少許過肩即成蓮華想真言曰唵沒羅含麼寧娑嚩二合賀次結地天印先合掌風以下四指頭相跓前方大開二空各著風側真言曰唵畢哩體地以反微曳娑嚩二合訶次結日天印不異前地天印但以二空頭各拄水下節真言曰唵阿去儞怛也二合野娑婆訶次結月天印如前梵天印但作拳中有月潔白相真言曰唵戰散反捺囉去也娑婆訶由結十二天王印及誦真言故修瑜伽者作諸事業威德自在復次聖者馬頭尊威怒王說大護身結界印及真言兩手從中指以下三指向外相叉各博著手背合掌二食指直竪相去五分許並二大指相著各屈一節勿著食指頭指來去真言曰唵一鉢囉毗迦悉跢二拔折羅涉筏二合囉上音羅支四娑嚩賀引聖者馬頭尊大威怒王復說大法身印真言兩手食指以下三指向外相叉指頭各博著手背合掌以二小指並竪相合並二大指相著屈怒大指來去真言曰曩莫三曼多沒馱南唵一社那社那二摩他摩他三可馱可馱四訶野紇哩嚩五吽發吒六娑嚩二合賀聖者馬頭尊大威怒王復說大法心印真言以二手食指以下四指向外相叉指頭各博著手背合掌並二大指相著各屈一節勿著食指大指來去真言曰曩莫三曼多沒馱南一阿密唎二合都納婆二合嚩吽發吒半音娑嚩二合賀聖者馬頭尊威怒王復說大法頭印真言曰準前護身印唯改二食指頭相拄各屈出二大節小尖頭真言曰曩莫三曼多沒馱南一跢姪他二斫迦唎怖三斫迦羅去叉唎怖四斫迦羅跛曇摩叉唎怖五阿謨伽去寫始羅去枳微上音二合六跛囉舍納伽車上音都七娑嚩二合引賀引聖者馬頭尊大威怒王復說大法頂印真言準前頭印唯改竪二食指頭相著列二中指在食指前頭相拄真言曰曩莫三曼多沒馱南一室唎二合羅𭈗至二吽發吒三娑嚩二合賀聖者馬頭尊大威怒王復說法口印真言曰復反叉二指於掌中直竪二中指頭相拄並竪二大指以右頭指捻右大指頭左頭指竪少曲在中指邊真言曰曩莫三曼多沒馱南一唵二體他以反嚕嚧三鳩嚕馱耶四娑嚩二合賀聖者馬頭尊大威怒王復說大法牙印真言準前印唯改二中指直竪頭相著二大指並竪博中指先以左小指握右無名指背後以右小指握左小指背真言曰南上謨上囉上多那二合跢怛囉二合夜引耶一南謨阿利耶二婆盧吉帝三攝婆二合囉上耶四菩提薩埵婆上耶五摩訶薩埵婆上耶六摩賀迦嚧尼迦耶七跢姪他八跢囉上二合吒九跢囉二合吒十末吒末吒十一瞋陀瞋陀十二頻陀頻陀十三吽吽十四發吒發吒十五娑嚩二合賀聖者馬頭尊大威怒王復說諸障噉食印真言左手各竪五指將右手下向以中指無名指大指頭各相拄真言曰曩莫三曼多沒馱南唅吽佉那野畔惹薩叵二合吒野娑嚩二合賀引聖者馬頭尊大威怒王復說禁斷諸障鋭刀印真言以定慧二手皆作金剛拳正直舒火風虛空持地水三昧手為鞘般若以為刀慧刀入住出皆在三昧鞘是即馬頭尊禁斷諸障密印威儀定手住其心慧手普旋轉應知所觸物即為去垢以此左旋即成辟除若結方隅界皆令隨右轉所餘衆事業滅惡淨諸障亦當如是作隨類而相應真言曰曩莫三曼多沒馱南一跢侄他